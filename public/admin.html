<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin | Medico Overseas</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .admin {
        max-width: 1280px;
        margin: 32px auto;
        padding: 20px;
      }
      .admin-panel {
        background: #fff;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 30px #0001;
        margin: 20px 0;
      }
      .admin input,
      .admin textarea,
      .admin select {
        width: 100%;
        padding: 11px;
        margin: 6px 0 12px;
        border: 1px solid #ccd3df;
        border-radius: 8px;
      }
      .admin table {
        font-size: 13px;
        min-width: 1050px;
      }
      .admin th {
        white-space: nowrap;
      }
      .hidden-admin {
        display: none;
      }
      .admin-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 2fr 1fr auto auto;
        gap: 10px;
        align-items: center;
      }
      .toolbar input,
      .toolbar select {
        margin: 0;
      }
      .message {
        min-height: 22px;
      }
      .status-new {
        color: #b44b00;
      }
      .status-contacted {
        color: #1955a5;
      }
      .status-qualified {
        color: #16703b;
      }
      .status-closed {
        color: #666;
      }
      .notes {
        min-width: 180px;
      }
      .pagination {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
      }
      .danger {
        background: #a72c2c;
        color: #fff;
        border: 0;
        padding: 8px 10px;
        border-radius: 6px;
      }
      .secondary {
        background: #eef2f7;
        color: #1f3864;
        border: 0;
        padding: 10px 12px;
        border-radius: 7px;
      }
      @media (max-width: 800px) {
        .admin-grid,
        .toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="admin">
      <a href="index.html">← Website</a>
      <h1>Medico Overseas Admin</h1>
      <section id="loginPanel" class="admin-panel">
        <h2>Secure Login</h2>
        <form id="loginForm">
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="btn">Login</button>
        </form>
        <p id="loginMsg" class="message"></p>
      </section>
      <div id="dashboard" class="hidden-admin">
        <button id="logout" class="btn">Logout</button>
        <section class="admin-panel">
          <h2>Student Enquiries</h2>
          <div class="toolbar">
            <input
              id="query"
              placeholder="Search name, phone, email, city or country"
            /><select id="statusFilter">
              <option value="">All statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="qualified">Qualified</option>
              <option value="closed">Closed</option></select
            ><button id="searchBtn" class="secondary">Search</button
            ><a class="btn" href="/api/admin/enquiries/export.csv"
              >Export CSV</a
            >
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Student</th>
                  <th>Contact</th>
                  <th>Interest</th>
                  <th>Message</th>
                  <th>Status</th>
                  <th>Internal notes</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="enquiries"></tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="prev" class="secondary">Previous</button
            ><span id="pageInfo"></span
            ><button id="next" class="secondary">Next</button>
          </div>
        </section>
        <section class="admin-panel">
          <h2>Create Blog Post</h2>
          <form id="blogForm" class="admin-grid">
            <div>
              <input name="title" placeholder="Title" required /><input
                name="slug"
                placeholder="Slug (optional)"
              /><textarea
                name="excerpt"
                rows="4"
                placeholder="Excerpt"
              ></textarea
              ><select name="category">
                <option value="general">General</option>
                <option value="country">Country</option>
                <option value="exam">Exam</option></select
              ><input
                name="featuredImage"
                placeholder="Featured image URL (optional)"
              /><label
                ><input name="published" type="checkbox" style="width: auto" />
                Publish now</label
              >
            </div>
            <div>
              <textarea
                name="content"
                rows="14"
                placeholder="Article content"
              ></textarea
              ><button class="btn">Create Post</button>
              <p id="blogMsg" class="message"></p>
            </div>
          </form>
          <h3>Existing Posts</h3>
          <div id="posts"></div>
        </section>
      </div>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
